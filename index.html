<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teachable Machine — Paper Waste Classifier</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --border: #262a36;
    --text: #e8eaf0;
    --muted: #8b93a7;
    --accent: #4f8cff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .app {
    width: 100%;
    max-width: 720px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 1.35rem;
    letter-spacing: -0.01em;
  }

  .sub {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 0.875rem;
  }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .tab {
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    padding: 8px 12px;
    color: var(--muted);
  }

  .tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }

  button {
    font: inherit;
    font-weight: 500;
    font-size: 0.9rem;
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, opacity 0.15s;
  }

  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  button.primary:hover:not(:disabled) { background: #3d7bf0; }

  .stage {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: flex-start;
  }

  #webcam-container canvas {
    width: 260px;
    height: 260px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: #000;
    display: block;
  }

  #webcam-container:empty::after {
    content: "Camera off";
    display: flex;
    align-items: center;
    justify-content: center;
    width: 260px;
    height: 260px;
    border-radius: 14px;
    border: 1px dashed var(--border);
    color: var(--muted);
    font-size: 0.8rem;
  }

  #photo-preview {
    width: 260px;
    height: 260px;
    object-fit: cover;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: #000;
    display: none;
  }

  #photo-preview.visible { display: block; }

  #photo-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 260px;
    height: 260px;
    border-radius: 14px;
    border: 1px dashed var(--border);
    color: var(--muted);
    font-size: 0.8rem;
  }

  #photo-placeholder.hidden { display: none; }

  .labels { flex: 1; min-width: 220px; }

  .label-row { margin-bottom: 14px; }

  .label-head {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    margin-bottom: 6px;
  }

  .label-head .prob { color: var(--muted); font-variant-numeric: tabular-nums; }

  .bar {
    height: 8px;
    border-radius: 99px;
    background: var(--border);
    overflow: hidden;
  }

  .bar > span {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 99px;
    background: var(--accent);
    transition: width 0.12s linear;
  }

  /* ---- Single verdict block (Photo mode) ---- */
  .verdict { display: none; }
  .verdict.visible { display: block; }

  .verdict-badge {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #6ee7a8;
    background: rgba(110, 231, 168, 0.12);
    border: 1px solid rgba(110, 231, 168, 0.35);
    padding: 3px 9px;
    border-radius: 99px;
    margin-bottom: 10px;
  }

  .verdict-badge.uncertain {
    color: #ffcf6b;
    background: rgba(255, 207, 107, 0.12);
    border-color: rgba(255, 207, 107, 0.35);
  }

  .verdict-label {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }

  .verdict-note {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .scores-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 12px;
  }

  .status {
    margin-top: 20px;
    font-size: 0.8rem;
    color: var(--muted);
    min-height: 1.2em;
  }

  .status.error { color: #ff6b6b; }

  /* ================= NEW: Tally + history ================= */
  .history {
    margin-top: 26px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
  }

  .history-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .history-head h2 {
    margin: 0;
    font-size: 1.05rem;
    letter-spacing: -0.01em;
  }

  button.danger { color: #ff8a8a; }
  button.danger:hover:not(:disabled) { border-color: #ff6b6b; }
  button.small { padding: 7px 14px; font-size: 0.8rem; }

  .tally {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 10px;
  }

  .tally-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    transition: border-color 0.2s, background 0.2s;
  }

  .tally-card.flash {
    border-color: var(--accent);
    background: rgba(79, 140, 255, 0.12);
  }

  .tally-count {
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }

  .tally-name {
    margin-top: 4px;
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: capitalize;
  }

  .tally-pct {
    margin-top: 2px;
    font-size: 0.72rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .tally-summary {
    margin: 0 0 18px;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .history-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 260px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    font-size: 0.85rem;
    border-bottom: 1px solid var(--border);
  }

  .history-item:last-child { border-bottom: none; }

  .history-item .what { font-weight: 600; text-transform: capitalize; }

  .history-item .meta {
    color: var(--muted);
    font-size: 0.75rem;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .history-item button {
    padding: 2px 9px;
    font-size: 0.9rem;
    line-height: 1.4;
    color: var(--muted);
    border-radius: 8px;
  }

  .history-empty {
    padding: 18px 14px;
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    border: 1px dashed var(--border);
    border-radius: 12px;
  }
</style>
</head>
<body>

<div class="app">
  <h1>Paper Waste Classifier</h1>
  <p class="sub">Classify paper waste as a paper cup, bowl or box — live, or from a captured photo.</p>

  <div class="tabs">
    <button id="tabLive" class="tab active" type="button">Live detection</button>
    <button id="tabPhoto" class="tab" type="button">Photo classify</button>
  </div>

  <!-- ============ LIVE MODE ============ -->
  <div id="liveMode">
    <div class="controls">
      <button id="startBtn" class="primary" type="button">Start camera</button>
      <button id="stopBtn" type="button" disabled>Stop</button>
    </div>

    <div class="stage">
      <div id="webcam-container"></div>
      <div id="label-container" class="labels"></div>
    </div>
  </div>

  <!-- ============ PHOTO MODE ============ -->
  <div id="photoMode" style="display:none">
    <div class="controls">
      <input id="photoInput" type="file" accept="image/*" capture="environment" hidden />
      <button id="takePhotoBtn" class="primary" type="button">Take / choose photo</button>
      <button id="clearPhotoBtn" type="button" disabled>Clear</button>
    </div>

    <div class="stage">
      <div id="photo-placeholder">No photo yet</div>
      <img id="photo-preview" alt="Captured photo" />

      <div class="labels">
        <div id="verdictBox" class="verdict">
          <div id="verdictBadge" class="verdict-badge">Identified</div>
          <h2 id="verdictLabel" class="verdict-label">—</h2>
          <p id="verdictNote" class="verdict-note">
            The final predicted class for the captured image
          </p>
        </div>

        <div id="photoScores"></div>
      </div>
    </div>
  </div>

  <div id="status" class="status"></div>

  <!-- ============ NEW: TALLY + HISTORY ============ -->
  <section class="history" aria-labelledby="historyTitle">
    <div class="history-head">
      <h2 id="historyTitle">Tally &amp; history</h2>
      <button id="resetBtn" class="danger small" type="button" disabled>Reset tally</button>
    </div>

    <div id="tally" class="tally"></div>
    <p id="tallySummary" class="tally-summary"></p>
    <ul id="historyList" class="history-list"></ul>
  </section>
</div>

<!-- Local copies in libs/. These must be tfjs 1.7.4 and @teachablemachine/image 0.8.4 -->
<script src="libs/tf.min.js"></script>
<script src="libs/teachablemachine-image.min.js"></script>

<script>
(function () {
  "use strict";

  // Correct model URL — keep this exact string. Previously the value was
  // corrupted with stray text, which made the page request the model
  // from the Live Server host instead of Google (hence the 404).
  
const MODEL_URL = "https://teachablemachine.withgoogle.com/models/dcKqWgKEP/";


  const SIZE = 260;   // display size in px
  const FLIP = true;  // mirror the webcam

  // Below this, we refuse to name a class instead of guessing.
  const MIN_CONFIDENCE = 0.60;

  // ---- NEW: tally settings ----
  // Live mode: a class must stay on top (>= MIN_CONFIDENCE) this long
  // before it is counted once, so one object isn't counted every frame.
  const HOLD_MS = 1500;
  const STORAGE_KEY = "paperWasteHistory.v1";
  const MAX_HISTORY = 500;
  const UNCERTAIN = "__uncertain"; // a take the model wasn't sure about

  // ---- Element handles ----
  const tabLive = document.getElementById("tabLive");
  const tabPhoto = document.getElementById("tabPhoto");
  const liveMode = document.getElementById("liveMode");
  const photoMode = document.getElementById("photoMode");

  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const statusEl = document.getElementById("status");
  const webcamContainer = document.getElementById("webcam-container");
  const labelContainer = document.getElementById("label-container");

  const photoInput = document.getElementById("photoInput");
  const takePhotoBtn = document.getElementById("takePhotoBtn");
  const clearPhotoBtn = document.getElementById("clearPhotoBtn");
  const photoPreview = document.getElementById("photo-preview");
  const photoPlaceholder = document.getElementById("photo-placeholder");
  const verdictBox = document.getElementById("verdictBox");
  const verdictBadge = document.getElementById("verdictBadge");
  const verdictLabel = document.getElementById("verdictLabel");
  const verdictNote = document.getElementById("verdictNote");
  const photoScores = document.getElementById("photoScores");

  // NEW
  const tallyEl = document.getElementById("tally");
  const tallySummary = document.getElementById("tallySummary");
  const resetBtn = document.getElementById("resetBtn");

  // ---- State ----
  let model = null;
  let webcam = null;
  let maxPredictions = 0;
  let running = false;
  let rafId = null;
  let labelEls = [];
  let lastStatusKey = "";
  let currentObjectURL = null;

  // NEW
  let classLabels = [];     // class names from the model
  let history = [];         // newest first
  let liveCandidate = null; // class currently being held in live mode
  let liveSince = 0;
  let liveLocked = false;   // already counted this hold

  function setStatus(message, isError) {
    // Avoid thrashing the DOM with the same message every frame
    const key = (isError ? "e:" : "i:") + message;
    if (key === lastStatusKey) return;
    lastStatusKey = key;
    statusEl.textContent = message;
    statusEl.classList.toggle("error", Boolean(isError));
  }

  async function loadModel() {
    if (model) return;
    setStatus("Loading model…");
    const modelURL = MODEL_URL + "model.json";
    const metadataURL = MODEL_URL + "metadata.json";
    model = await tmImage.load(modelURL, metadataURL);
    maxPredictions = model.getTotalClasses();
    captureLabels(); // NEW
  }

  // ============================================================
  //  NEW: TALLY + HISTORY  (saved in this browser via localStorage)
  // ============================================================
  function captureLabels() {
    try {
      classLabels = model.getClassLabels();
    } catch (e) {
      classLabels = [];
    }
    renderHistory();
  }

  function loadHistory() {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      history = Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      history = [];
    }
  }

  function saveHistory() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch (e) {
      // Storage unavailable — tally still works for this session
    }
  }

  function getCounts() {
    const counts = {};
    classLabels.forEach(function (l) { counts[l] = 0; });
    history.forEach(function (h) {
      if (h.label === UNCERTAIN) return;
      counts[h.label] = (counts[h.label] || 0) + 1;
    });
    return counts;
  }

  function formatTime(ts) {
    const d = new Date(ts);
    const today = new Date();
    const time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    if (d.toDateString() === today.toDateString()) return "Today, " + time;
    return d.toLocaleDateString([], { month: "short", day: "numeric" }) + ", " + time;
  }

  function renderHistory(flashLabel) {
    // --- Tally cards ---
    const counts = getCounts();
    const identified = Object.keys(counts).reduce(function (n, k) { return n + counts[k]; }, 0);
    const uncertain = history.length - identified;
    tallyEl.innerHTML = "";

    Object.keys(counts).forEach(function (label) {
      const card = document.createElement("div");
      card.className = "tally-card";
      card.dataset.label = label;

      const num = document.createElement("div");
      num.className = "tally-count";
      num.textContent = counts[label];

      const name = document.createElement("div");
      name.className = "tally-name";
      name.textContent = label;

      const pct = document.createElement("div");
      pct.className = "tally-pct";
      pct.textContent = identified ? Math.round((counts[label] / identified) * 100) + "%" : "0%";

      card.append(num, name, pct);
      tallyEl.appendChild(card);

      if (flashLabel && flashLabel === label) {
        card.classList.add("flash");
        window.setTimeout(function () { card.classList.remove("flash"); }, 600);
      }
    });

    tallySummary.textContent =
      history.length + " take" + (history.length === 1 ? "" : "s") + " in total" +
      (uncertain ? " · " + uncertain + " uncertain (not counted in the segments)" : "") + ".";

    // --- History list ---
    let list = document.getElementById("historyList");

    if (!history.length) {
      const empty = document.createElement("div");
      empty.className = "history-empty";
      empty.textContent = "No items yet. Identified items will be listed here.";
      empty.id = "historyList";
      list.replaceWith(empty);
      resetBtn.disabled = true;
      return;
    }

    // If the empty message replaced the list earlier, put a <ul> back
    if (list.tagName !== "UL") {
      const ul = document.createElement("ul");
      ul.id = "historyList";
      ul.className = "history-list";
      list.replaceWith(ul);
      list = ul;
    }
    list.innerHTML = "";

    history.forEach(function (h) {
      const li = document.createElement("li");
      li.className = "history-item";

      const what = document.createElement("span");
      what.className = "what";
      what.textContent = h.label === UNCERTAIN
        ? "Uncertain" + (h.guess ? " (best guess: " + h.guess + ")" : "")
        : h.label;

      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent =
        (h.source === "live" ? "Live" : "Photo") + " · " +
        (h.confidence * 100).toFixed(0) + "% · " + formatTime(h.time);

      const del = document.createElement("button");
      del.type = "button";
      del.title = "Remove this entry";
      del.setAttribute("aria-label", "Remove this entry");
      del.textContent = "×";
      del.addEventListener("click", function () {
        history = history.filter(function (x) { return x.id !== h.id; });
        saveHistory();
        renderHistory();
      });

      const right = document.createElement("span");
      right.style.display = "flex";
      right.style.alignItems = "center";
      right.style.gap = "10px";
      right.append(meta, del);

      li.append(what, right);
      list.appendChild(li);
    });

    resetBtn.disabled = false;
  }

  function addEntry(label, confidence, source, guess) {
    history.unshift({
      id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
      label: label,
      confidence: confidence,
      source: source,
      guess: guess || null,
      time: Date.now()
    });
    if (history.length > MAX_HISTORY) history.length = MAX_HISTORY;
    saveHistory();
    renderHistory(label);
  }

  resetBtn.addEventListener("click", function () {
    if (!history.length) return;
    if (!window.confirm("Reset the tally and clear all history?")) return;
    history = [];
    saveHistory();
    renderHistory();
  });

  // Live mode: count an item once it has been held steady
  function trackLive(top) {
    const now = window.performance.now();

    if (top.probability < MIN_CONFIDENCE) {
      liveCandidate = null;
      liveLocked = false;
      return;
    }

    if (top.className !== liveCandidate) {
      liveCandidate = top.className;
      liveSince = now;
      liveLocked = false;
      return;
    }

    if (!liveLocked && now - liveSince >= HOLD_MS) {
      liveLocked = true;
      addEntry(top.className, top.probability, "live");
    }
  }

  function resetLiveTracking() {
    liveCandidate = null;
    liveSince = 0;
    liveLocked = false;
  }

  // ============================================================
  //  TAB SWITCHING
  // ============================================================
  function showLive() {
